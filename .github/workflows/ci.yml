name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.303
      - run: dotnet restore Sitrep.slnx --locked-mode
      - run: dotnet build Sitrep.slnx -c Release --no-restore
      - run: dotnet test tests/Sitrep.Tests/Sitrep.Tests.csproj -c Release --no-build
      - run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/setup-model.ps1
      - run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/publish.ps1
      - run: out/Sitrep-win-x64/Sitrep.exe --self-test
